# pve-kiosk configuration. Apply changes with: systemctl restart pve-kiosk

# Page to open. Empty = the local Proxmox web UI, picking a URL that matches
# the certificate pveproxy is serving (127.0.0.1 for the default one, the
# certificate's hostname for a custom or ACME one).
# Any full URL works, port included, e.g. 'https://grafana.lan:3000/'.
# A self-signed certificate on another site will show a warning.
PVE_KIOSK_URL=''

# yes = the browser can only open the kiosk page's own site.
# no  = any URL (the address bar is still hidden, but links work).
PVE_KIOSK_RESTRICT='yes'

# Extra sites to allow when restricted, space separated, Chromium URL
# pattern format. Example: 'https://pve.proxmox.com https://grafana.lan'
PVE_KIOSK_ALLOW=''

# Zoom factor, e.g. '1.5' for a 4K TV on a small desk. Empty = automatic.
PVE_KIOSK_SCALE=''

# Extra cage flags. cage 0.2 (Debian 13) spans all connected displays by
# default; '-m last' uses only the last one. cage 0.1 (Debian 12) is the
# other way round: last display by default, '-m extend' to span.
CAGE_ARGS=''

# Extra Chromium flags.
CHROMIUM_FLAGS=''
